{% extends "admin_base.html" %}
{% block title %}Админ — Обращения{% endblock %}
{% block admin_content %}
<div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <h1 class="adm-h1">Обращения</h1>
    <div class="flex gap-2">
        <a href="?show=open" class="{{ 'adm-btn' if show == 'open' else 'adm-btn-ghost' }}">Открытые ({{ counts.get('OPEN', 0) }})</a>
        <a href="?show=mine" class="{{ 'adm-btn' if show == 'mine' else 'adm-btn-ghost' }}">Мои</a>
        <a href="?show=closed" class="{{ 'adm-btn' if show == 'closed' else 'adm-btn-ghost' }}">Закрытые ({{ counts.get('CLOSED', 0) }})</a>
    </div>
</div>

<div id="chat-list">{% include "_admin_chat_list.html" %}</div>
{% endblock %}

{% block scripts %}
<script>
    // Список обновляется сам при любом новом сообщении покупателя (событие из admin_base)
    document.addEventListener('admin:events', async e => {
        if (!e.detail.changed.msg && !e.detail.changed.chats) return;
        try {
            const r = await fetch(location.pathname + '?show={{ show }}&partial=1', {cache: 'no-store'});
            if (r.ok) document.getElementById('chat-list').innerHTML = await r.text();
        } catch (err) {}
    });
</script>
{% endblock %}
