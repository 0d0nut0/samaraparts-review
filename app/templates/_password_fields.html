{% macro fields(name='password', label='Пароль') %}
<div>
    <label class="label" for="{{ name }}">{{ label }}</label>
    <div class="relative">
        <input class="field pr-24" id="{{ name }}" type="password" name="{{ name }}" required minlength="8" maxlength="128" autocomplete="new-password" data-password aria-describedby="{{ name }}-hint {{ name }}-strength">
        <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm font-medium px-2 py-1" data-password-toggle aria-controls="{{ name }}" aria-pressed="false">Показать</button>
    </div>
    <p class="hint mt-1" id="{{ name }}-hint">8–128 символов: заглавная и строчная буквы, цифра и специальный символ.</p>
    <p class="hint mt-1" id="{{ name }}-strength" data-password-strength aria-live="polite"></p>
</div>
<div>
    <label class="label" for="password_confirm">Подтверждение пароля</label>
    <input class="field" id="password_confirm" type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password" data-password-confirm>
</div>
{% endmacro %}
