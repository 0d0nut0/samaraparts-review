<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ПАРТС</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Onest, system-ui, sans-serif;
               background: var(--tg-theme-bg-color, #EEF1F4); color: var(--tg-theme-text-color, #1B2633); }
        .box { text-align: center; padding: 24px; }
        .logo { width: 56px; height: 56px; border-radius: 14px; background: #FFC21A; display: grid; place-items: center; margin: 0 auto 16px; }
        a { color: var(--tg-theme-link-color, #2C5D8F); }
    </style>
</head>
<body>
<div class="box">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1B2633" stroke-width="2.2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/></svg></div>
    <div id="msg">Открываем магазин…</div>
</div>
<script>
(async function () {
    const tg = window.Telegram && Telegram.WebApp;
    const msg = document.getElementById('msg');
    if (tg) { tg.ready(); tg.expand(); }
    if (!tg || !tg.initData) { location.replace('/catalog'); return; }
    try {
        const r = await fetch('/tg/auth', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify({init_data: tg.initData})});
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Не удалось войти');
        const start = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        location.replace(start && /^[A-Za-z0-9_-]+$/.test(start) ? '/catalog/' + start : '/catalog');
    } catch (e) {
        msg.innerHTML = e.message + '. <a href="/catalog">Открыть каталог</a>';
    }
})();
</script>
</body>
</html>
